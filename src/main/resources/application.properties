server.port=8086

spring.profiles.active=postgres
spring.application.name=uetlib-job-testapp-local

spring.mvc.problemdetails.enabled=true

#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false

logging.config=classpath:logback-spring.xml


############ Datasource ############

spring.datasource.hikari.max-lifetime=600000
spring.flyway.locations=classpath:/db/migration/templates/{vendor}


############ Swagger ############

# Swagger UI properties (See: https://springdoc.org/#swagger-ui-properties)
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/api-docs/swagger-ui
springdoc.swagger-ui.displayRequestDuration=true
springdoc.swagger-ui.defaultModelsExpandDepth=2
springdoc.swagger-ui.syntaxHighlight.theme=arta


############ Logbook ############

logbook.format.style=http
#logbook.obfuscate.headers=Authorization,Content-Security-Policy,Set-Cookie,Permissions-Policy
logbook.obfuscate.headers=DO_NOT_OBFUSCATE
#logbook.obfuscate.parameters=access_token,subject_token
logbook.obfuscate.parameters=DO_NOT_OBFUSCATE
ch.ubique.backend.job.testapp.logbook.body-filter.enabled=false


############ Application Config ############

ch.ubique.backend.spring.boot.http.default-user-agent=uetlib-job-testapp-local/${build-properties.version}

